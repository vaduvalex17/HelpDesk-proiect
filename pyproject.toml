[project]
name = "helpdesk-it"
version = "0.1.0"
description = "Sistem web de gestionare a tichetelor de suport tehnic"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
