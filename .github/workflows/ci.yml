name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-si-teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalare dependențe
        run: pip install -r requirements-dev.txt
      - name: Linter (Ruff)
        run: ruff check .
      - name: Teste (pytest)
        run: pytest -q
