{#
  F1 – Formularul de autentificare (email + parolă), trimis prin POST la /login.
#}
{% extends "base.html" %}
{% block title %}Autentificare – HelpDesk IT{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Autentificare</h1>
        <form method="post">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required autofocus>
          </div>
          <div class="mb-3">
            <label for="parola" class="form-label">Parolă</label>
            <input type="password" class="form-control" id="parola" name="parola" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Intră în cont</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
